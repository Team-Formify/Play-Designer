<title>Learn the Plays — Lehi Special Teams</title>
<style>
  :root{
    --deep:#13251F; --board:#1D3A31; --chalk:#EDEBE0; --gold:#E3B547; --warm:#E58A6B;
    --soft:rgba(237,235,224,.62); --good:#8FD19E;
    --body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
    --display:'Haettenschweiler','Arial Narrow',Impact,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--deep);color:var(--chalk);font-family:var(--body);
    -webkit-text-size-adjust:100%}
  header{background:var(--board);padding:12px 14px;display:flex;align-items:center;gap:10px;
    flex-wrap:wrap;border-bottom:1px solid rgba(237,235,224,.16)}
  h1{font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.04em;
    font-size:19px;margin:0;flex:1;min-width:130px}
  h1 span{color:var(--gold)}
  /* A way back to the coach's app. A boy will not miss it and Dom will not have to
     retype the address every time he checks what they are seeing. */
  .back{background:var(--deep);color:var(--soft);border:1px solid rgba(237,235,224,.28);
    border-radius:6px;padding:9px 11px;font-size:14px;text-decoration:none;white-space:nowrap;
    -webkit-tap-highlight-color:transparent}
  .back:active{color:var(--gold);border-color:var(--gold)}
  .bld{font-family:var(--mono);font-size:10px;color:var(--soft);opacity:.6}
  select{background:var(--deep);color:var(--chalk);border:1px solid rgba(237,235,224,.28);
    border-radius:6px;padding:9px 8px;font-size:15px;font-family:inherit;max-width:190px}
  .wrap{max-width:560px;margin:0 auto;padding:0 12px 40px}
  #lookBar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;
    padding:10px 14px 0;max-width:560px;margin:0 auto}
  #lookBar .lkHint{font-family:var(--mono);font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--soft)}
  #lookBar button{background:var(--board);color:var(--soft);
    border:1px solid rgba(237,235,224,.2);border-radius:14px;padding:8px 13px;
    font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;
    cursor:pointer;-webkit-tap-highlight-color:transparent}
  #lookBar button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
  .beat{margin:10px 0;padding:10px 12px;border-radius:8px;
    border:1px solid rgba(229,138,107,.32);background:rgba(229,138,107,.08)}
  .beat p{margin:0 0 6px;font-size:14px;line-height:1.42}
  .beat p:last-child{margin-bottom:0}
  .tabs{display:flex;gap:6px;padding:10px 0 0}
  .tab{flex:1;background:var(--board);color:var(--soft);border:1px solid rgba(237,235,224,.2);
    border-radius:8px;padding:11px 4px;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;
    text-transform:uppercase;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .tab[aria-pressed="true"]{background:var(--gold);color:var(--deep);border-color:var(--gold);font-weight:700}
  .tab[disabled]{opacity:.34;cursor:default}
  .hint{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--soft);line-height:1.55;margin:9px 0 0}
  .fieldbox{background:var(--board);border-radius:8px;margin-top:10px;overflow:hidden;
    border:1px solid rgba(237,235,224,.14)}
  svg{display:block;width:100%;height:auto;touch-action:manipulation}
  .ask{font-size:17px;line-height:1.35;margin:14px 0 0;min-height:52px}
  .ask b{color:var(--gold)}
  .say{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--soft);margin:12px 0 6px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .btn{background:var(--board);color:var(--chalk);border:1px solid rgba(237,235,224,.26);
    border-radius:8px;padding:12px 14px;font-size:15px;font-family:inherit;cursor:pointer;
    -webkit-tap-highlight-color:transparent}
  .btn:active{background:var(--gold);color:var(--deep)}
  .btn.gold{background:var(--gold);color:var(--deep);border-color:var(--gold);font-weight:600}
  .btn.wide{flex:1;min-width:120px}
  .opt{display:block;width:100%;text-align:left;background:var(--board);color:var(--chalk);
    border:1px solid rgba(237,235,224,.22);border-radius:8px;padding:13px 14px;margin-top:9px;
    font-size:15px;line-height:1.4;font-family:inherit;cursor:pointer;
    -webkit-tap-highlight-color:transparent}
  .opt:active{border-color:var(--gold)}
  .opt.right{border-color:var(--good);background:rgba(143,209,158,.14)}
  .opt.wrong{border-color:var(--warm);background:rgba(229,138,107,.14)}
  .score{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--soft);margin-top:14px}
  .score b{color:var(--gold);font-size:15px}
  .verdict{font-size:16px;margin-top:10px;line-height:1.4}
  .verdict.good{color:var(--good)} .verdict.near{color:var(--gold)} .verdict.off{color:var(--warm)}
  .jobcard{background:var(--board);border-left:3px solid var(--gold);border-radius:6px;
    padding:12px 14px;margin-top:12px;font-size:15px;line-height:1.45}
  .jobcard .r{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--warm);display:block;margin-bottom:5px}
  input[type=range]{width:100%;margin-top:12px;accent-color:var(--gold)}
  .load{padding:40px 14px;text-align:center;color:var(--soft)}
  .hide{display:none!important}
  .src{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--soft);margin:8px 0 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .src b{color:var(--gold);font-weight:500}
  .src button{background:transparent;color:var(--soft);border:1px solid rgba(237,235,224,.22);
    border-radius:4px;padding:3px 8px;font-family:inherit;font-size:10px;letter-spacing:.06em;
    text-transform:uppercase;cursor:pointer}
</style>

<body>

<header>
  <h1>Learn <span>the Plays</span></h1>
  <select id="playSel" aria-label="Pick a play"></select>
  <a class="back" href="/designer" id="backLink">&#8592; Designer</a>
  <span class="bld" id="buildNote">b20</span>
</header>

<div id="lookBar" role="group" aria-label="Which kick" hidden></div>

<div class="wrap">
  <div class="tabs" role="group" aria-label="Mode">
    <button class="tab" data-m="watch" aria-pressed="true">Watch it</button>
    <button class="tab" data-m="lineup" aria-pressed="false">Line me up</button>
    <button class="tab" data-m="quiz" aria-pressed="false">My job</button>
  </div>

  <!-- Only ever shown on one of the head coach's plays. His diagrams carry a
       caption for the whole play and nothing written per man, so My job has
       nothing it could score — it says so and switches itself off rather than
       asking a question it cannot mark. -->
  <p class="hint hide" id="noJobs">My job is off on the offense and defense
    &mdash; those plays do not carry a written job for each man yet.</p>

  <div class="fieldbox"><svg id="field" viewBox="0 0 420 500" role="img" aria-label="Play"></svg></div>
  <p class="load" id="loading">Loading the playbook…</p>
  <p class="src" id="srcNote"></p>

  <div id="watchUI" class="hide">
    <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Scrub the play">
    <div class="row">
      <button class="btn gold wide" id="playBtn">▶ Play</button>
      <button class="btn" id="slowBtn">Slow</button>
      <button class="btn" id="againBtn">Again</button>
      <button class="btn" id="themBtn" aria-pressed="true">Them: on</button>
    </div>
    <p class="ask" id="watchNote"></p>
  </div>

  <div id="lineupUI" class="hide">
    <p class="ask" id="lineAsk"></p>
    <p class="verdict" id="lineVerdict"></p>
    <div class="row"><button class="btn gold wide" id="lineNext">Next man</button>
      <button class="btn" id="lineRestart">Start over</button></div>
    <p class="score" id="lineScore"></p>
  </div>

  <div id="quizUI" class="hide">
    <p class="ask" id="quizAsk"></p>
    <div id="quizOpts"></div>
    <p class="verdict" id="quizVerdict"></p>
    <div id="quizBeat" class="beat hide"></div>
    <div class="row"><button class="btn gold wide" id="quizNext">Next question</button>
      <button class="btn" id="quizRestart">Start over</button></div>
    <p class="score" id="quizScore"></p>
  </div>
</div>

<script id="play-engine">
/* Generated from play-engine.js by scripts/sync-engine.js. Do not edit here —
   edit play-engine.js and re-run it, or the two copies drift apart again. */
/* play-engine.js — the shared geometry behind both apps.
 *
 * The coach's app and the boys' app were each carrying their own copy of this,
 * and every fix had to be written twice. Four times in one day the second copy
 * was the one that went wrong. This is the one source of truth for it.
 *
 * Pure functions only: no DOM, no storage, no knowledge of either page's data
 * shapes. Each page passes plain numbers in and decorates what comes back.
 *
 * It is INLINED into index.html and learn.html by scripts/sync-engine.js, the
 * same way special-teams-plays.json is, because a <script src> cannot be read
 * when the page is opened as a downloaded file or run inside the artifact
 * viewer. Edit this file, then run:
 *
 *     node scripts/sync-engine.js
 *     node scripts/sync-engine.js --check     # exit 1 if they have drifted
 *
 * No dependencies, no build step. Running the app needs nothing.
 */
var PE = (function () {
  var VBW = 420, VBH = 500;

  /* ---------- curves ----------
     Nobody runs in straight lines with corners on them. The stored points are
     the shape of the run; these round them into one continuous path and sample
     that same path, so a man runs along the line that is drawn rather than
     cutting its corners. Two points stay a straight line, because that is what
     a straight line is. */
  var CURVE = 0.5;

  function smoothD(pts) {
    if (!pts || pts.length < 2) return '';
    var d = 'M' + pts[0].x + ',' + pts[0].y;
    if (pts.length === 2) return d + ' L' + pts[1].x + ',' + pts[1].y;
    for (var i = 0; i < pts.length - 1; i++) {
      var p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || pts[i + 1];
      d += ' C' + (p1.x + (p2.x - p0.x) / 6 * CURVE) + ',' + (p1.y + (p2.y - p0.y) / 6 * CURVE) +
           ' ' + (p2.x - (p3.x - p1.x) / 6 * CURVE) + ',' + (p2.y - (p3.y - p1.y) / 6 * CURVE) +
           ' ' + p2.x + ',' + p2.y;
    }
    return d;
  }

  function smoothPts(pts) {
    if (!pts || pts.length < 3) return pts || [];
    var out = [{ x: pts[0].x, y: pts[0].y }], STEP = 6;
    for (var i = 0; i < pts.length - 1; i++) {
      var p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || pts[i + 1];
      var c1x = p1.x + (p2.x - p0.x) / 6 * CURVE, c1y = p1.y + (p2.y - p0.y) / 6 * CURVE;
      var c2x = p2.x - (p3.x - p1.x) / 6 * CURVE, c2y = p2.y - (p3.y - p1.y) / 6 * CURVE;
      for (var k = 1; k <= STEP; k++) {
        var u = k / STEP, v = 1 - u;
        out.push({ x: v * v * v * p1.x + 3 * v * v * u * c1x + 3 * v * u * u * c2x + u * u * u * p2.x,
                   y: v * v * v * p1.y + 3 * v * v * u * c1y + 3 * v * u * u * c2y + u * u * u * p2.y });
      }
    }
    return out;
  }

  /* Where a man is when the clock reads t, along the whole path. */
  function walk(pts, t) {
    if (!pts || !pts.length) return { x: 0, y: 0 };
    var segs = [], total = 0, i;
    for (i = 1; i < pts.length; i++) {
      var L = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
      segs.push(L); total += L;
    }
    if (total <= 0) return pts[0];
    var want = total * t, run = 0;
    for (i = 0; i < segs.length; i++) {
      if (run + segs[i] >= want) {
        var f = segs[i] ? (want - run) / segs[i] : 0;
        return { x: pts[i].x + (pts[i + 1].x - pts[i].x) * f,
                 y: pts[i].y + (pts[i + 1].y - pts[i].y) * f };
      }
      run += segs[i];
    }
    return pts[pts.length - 1];
  }

  function rectsOverlap(a, b) {
    return !(a.x + a.w <= b.x || b.x + b.w <= a.x || a.y + a.h <= b.y || b.y + b.h <= a.y);
  }

  /* ---------- the other team ----------
     A kickoff and a kick return are the two sides of the same snap, so the
     likely opposing look on one IS the other: his own coached play, reflected
     across the line of scrimmage and flipped left to right, because their left
     is our right. Scaled so it fits the depth the host play has to spare.

       host = {los, ours:[{x,y}]}
       src  = {los, ours:[{id,x,y,...}], routes:[{playerId, points:[{x,y}]}]}

     Returns {men:[{x,y,q,path}], routes:[{from,points}]}, where q is the source
     player untouched — labels, lanes and jobs come along with him, which is what
     lets the matchup be named instead of invented. */
  function mid(list, key) {
    return list.reduce(function (a, q) { return a + q[key]; }, 0) / (list.length || 1);
  }

  function mirror(host, src) {
    var ho = host.ours || [], so = src.ours || [];
    if (!ho.length || !so.length) return { men: [], routes: [] };
    var sSgn = Math.sign(mid(so, 'y') - src.los) || 1;
    var hSgn = -(Math.sign(mid(ho, 'y') - host.los) || 1);
    var depth = Math.max.apply(null, so.map(function (q) { return Math.abs(q.y - src.los); })) || 1;
    var room = (hSgn < 0 ? (host.los - 18) : (VBH - 18 - host.los));
    var k = Math.min(1, Math.max(0.2, room / depth));
    function M(x, y) { return { x: VBW - x, y: host.los + hSgn * ((y - src.los) * sSgn) * k }; }

    var rt = {};
    (src.routes || []).forEach(function (r) { rt[r.playerId] = r; });
    var routes = [];
    var men = so.map(function (q) {
      var m = M(q.x, q.y);
      m.q = q;
      var r = rt[q.id];
      m.path = [{ x: m.x, y: m.y }].concat(
        (r && r.points) ? r.points.map(function (t) { return M(t.x, t.y); }) : []);
      if (m.path.length > 1) routes.push({ from: m.path[0], points: m.path.slice(1) });
      return m;
    });
    return { men: men, routes: routes };
  }

  /* ---------- who is across from whom ----------
     Anything he has assigned by hand is the answer and takes its man off the
     board first. Nearest-man is a fair guess on a kickoff and a poor one on a
     return, where a wall man blocks the cover man arriving in his zone rather
     than the one standing closest at the snap. Best pair first, so two of ours
     cannot claim the same man while a third goes unmatched.

       ours = [{id, x, y, covers}]        men = from mirror(), or stored X's
       labelOf(man) -> the label to match `covers` against

     Returns {ourId: {bi, assigned}}. */
  function matchups(ours, men, labelOf) {
    var out = {}, usedA = {}, usedB = {};
    if (!men.length) return out;
    labelOf = labelOf || function (m) { return (m.q && m.q.label) || m.label || ''; };

    ours.forEach(function (a) {
      if (!a.covers) return;
      var bi = -1;
      men.forEach(function (m, i) { if (bi < 0 && labelOf(m) === a.covers) bi = i; });
      if (bi < 0 || usedB[bi]) return;   // a label renamed on the other play: fall back to auto
      usedA[a.id] = 1; usedB[bi] = 1;
      out[a.id] = { bi: bi, assigned: true };
    });

    var pairs = [];
    ours.forEach(function (a) {
      if (usedA[a.id]) return;
      men.forEach(function (b, bi) {
        if (usedB[bi]) return;
        pairs.push({ a: a, bi: bi, d: Math.hypot(a.x - b.x, a.y - b.y) });
      });
    });
    pairs.sort(function (x, y) { return x.d - y.d; });
    pairs.forEach(function (pr) {
      if (usedA[pr.a.id] || usedB[pr.bi]) return;
      usedA[pr.a.id] = 1; usedB[pr.bi] = 1;
      out[pr.a.id] = { bi: pr.bi, assigned: false };
    });
    return out;
  }

  /* ---------- where they collide ----------
     Both men are walked down their own routes on one clock. The collision is the
     first step where they are within touching distance AND somebody has actually
     run there — a pair lined up across the ball starts inside touching distance,
     and without that check the very first sample counts and both men freeze on
     their own alignment without ever moving. A pair that never quite touches
     counts at its closest approach, provided that is close enough to be a
     collision and not two men passing on opposite sides of the field. A pair he
     assigned himself always gets a mark, however far apart their routes keep
     them: he has said this man takes that man, so a mark sitting off on its own
     is the app telling him the route needs redrawing.

       pairs = [{id, bi, assigned, ours:[pts], theirs:[pts]}]

     Returns [{id, bi, assigned, t, a, b, d, x, y}] — a and b are where each man
     stops, x/y the point between them. */
  var TOUCH = 22, NEAR = 44, MOVED = 16;

  function meets(pairs) {
    var out = [];
    (pairs || []).forEach(function (pr) {
      var a = pr.ours || [], b = pr.theirs || [];
      if (a.length < 2 && b.length < 2) return;   // nobody moves; there is no collision
      var a0 = a[0], b0 = b[0], hit = null, near = null;
      for (var i = 0; i <= 120; i++) {
        var t = i / 120, pa = walk(a, t), pb = walk(b, t);
        var gone = Math.hypot(pa.x - a0.x, pa.y - a0.y) + Math.hypot(pb.x - b0.x, pb.y - b0.y);
        if (gone < MOVED) continue;
        var d = Math.hypot(pa.x - pb.x, pa.y - pb.y);
        if (!near || d < near.d) near = { t: t, a: pa, b: pb, d: d };
        if (d <= TOUCH) { hit = { t: t, a: pa, b: pb, d: d }; break; }
      }
      var c = hit || ((near && (pr.assigned || near.d <= NEAR)) ? near : null);
      if (!c) return;
      out.push({ id: pr.id, bi: pr.bi, assigned: !!pr.assigned,
                 t: c.t, a: c.a, b: c.b, d: c.d,
                 x: (c.a.x + c.b.x) / 2, y: (c.a.y + c.b.y) / 2 });
    });
    return out;
  }

  return {
    VBW: VBW, VBH: VBH, CURVE: CURVE,
    MEET_TOUCH: TOUCH, MEET_NEAR: NEAR, MEET_MOVED: MOVED,
    smoothD: smoothD, smoothPts: smoothPts, walk: walk, rectsOverlap: rectsOverlap,
    mirror: mirror, matchups: matchups, meets: meets
  };
})();
</script>
<script>
var NS='http://www.w3.org/2000/svg';
function E(t,a){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);return e;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

var VB={w:420,h:500}, VIEW={x:0,y:0,w:420,h:500};
var DATA=null, BY_SLUG={}, ROSTER={}, play=null, mode='watch';
var svg=document.getElementById('field');

/* A kickoff is one alignment with several outcomes — the file gives a unit either
   a flat aim+routes or a list of looks. Read both, exactly as the coach's app does. */
var lookIx=0, showThem=true;
function looksOf(p){
  if(!p)return [{id:'base',name:'Base',aim:null,routes:[]}];
  if(!p._looks){
    p._looks=(p.looks&&p.looks.length)?p.looks.map(function(lk,i){
      return {id:lk.id||('look'+i),name:lk.name||('Look '+(i+1)),how:lk.how||'',
              aim:lk.aim||null,routes:lk.routes||[]};
    }):[{id:'base',name:'Base',how:'',aim:p.aim||null,routes:p.routes||[]}];
  }
  return p._looks;
}
function look(p){
  var l=looksOf(p);
  return l[Math.min(lookIx,l.length-1)];
}

/* The other team is one of the coach's own plays — a kickoff faces a kick return,
   a punt faces a punt return — reflected across the line and flipped left to right,
   because their left is our right. Derived, never stored. */
var themCache=null, themKey='';
function themOf(p){
  /* One of the head coach's plays already has its other eleven — his artwork
     draws both sides, so they are read off the picture rather than mirrored out
     of a paired play of ours. Same shape either way, so nothing downstream
     knows the difference. */
  if(p&&p._them)return p._them;
  var key=(p&&p.slug)+'|'+lookIx;
  if(themKey===key&&themCache)return themCache;
  themKey=key; themCache=buildThem(p);
  return themCache;
}
function buildThem(p){
  var src=BY_SLUG[p.mirrorOf||''];
  var ho=ours(p), so=src?src.players.filter(function(q){return q.team==='us';}):[];
  if(!src||!ho.length||!so.length)return {men:[],routes:[],name:''};
  // the opposing play's first look; the boys' page does not pick theirs
  var sLook=(src.looks&&src.looks.length)?src.looks[0]:{routes:src.routes||[]};
  var out=PE.mirror({los:p.lineOfScrimmage,ours:ho},
                    {los:src.lineOfScrimmage,ours:so,routes:sLook.routes||[]});
  out.men.forEach(function(m){
    m.raw=[{x:m.x,y:m.y}].concat((m.path||[]).slice(1));
    m.path=PE.smoothPts(m.raw);
    m.label=(m.q&&m.q.label)||''; m.role=(m.q&&m.q.role)||''; m.job=(m.q&&m.q.job)||'';
  });
  out.routes=out.men.filter(function(m){return m.path.length>1;});
  out.name=src.name;
  return out;
}
/* Who is across from each of ours, best pair first. */
function matchups(p){
  var th=themOf(p), out={};
  if(!th.men.length)return out;
  /* `covers` names the man taken. On our plays that is his label; on the head
     coach's it is the man's id off the drawing, because two of his defenders
     can both be labelled T and only the block tee says which one is blocked.
     Ours carry no `key`, so they fall through to the label exactly as before. */
  var pairs=PE.matchups(ours(p),th.men,function(m){return m.key||m.label||'';});
  Object.keys(pairs).forEach(function(id){
    var m=th.men[pairs[id].bi];
    m.bi=pairs[id].bi; m.assigned=pairs[id].assigned;
    out[id]=m;
  });
  return out;
}
/* Where each pair actually meets. Two men who are matched up run their own routes
   until they come together; that spot is the block, or the tackle, and it is the
   thing the boys need to see. Walk both paths on the same clock, take the first
   step where they are within touching distance, and if they never quite touch,
   take their closest approach — provided it is close enough to be a collision and
   not two men passing on opposite sides of the field. Once a pair has met, both
   stop there for the rest of the run. */
var meetCache=null, meetKey='';
function meets(p){
  var key=(p&&p.slug)+'|'+lookIx;
  if(meetKey===key&&meetCache)return meetCache;
  meetKey=key;
  var out={us:{},them:{},list:[]};
  var th=themOf(p), mu=matchups(p), pairs=[], mine={};
  ours(p).forEach(function(q){
    var m=mu[q.id]; if(!m||!th.men.length)return;
    mine[q.id]={q:q,m:m};
    pairs.push({id:q.id,bi:m.bi,assigned:m.assigned,
      ours:pathOf(p,q).pts, theirs:m.path});
  });
  PE.meets(pairs).forEach(function(c){
    var e=mine[c.id];
    c.mine=e.q; c.his=e.m;
    out.us[c.id]=c; out.them[c.bi]=c; out.list.push(c);
  });
  meetCache=out;
  return out;
}
/* Same fit as the coach's app, same cap, so a cluster does not blow up. */
function computeView(p,extra){
  var xs=[],ys=[],c;
  p.players.forEach(function(q){xs.push(q.x);ys.push(q.y);});
  var CL=look(p);
  (CL.routes||[]).forEach(function(r){(r.points||[]).forEach(function(t){xs.push(t.x);ys.push(t.y);});});
  if(showThem){
    themOf(p).men.forEach(function(m){
      m.path.forEach(function(t){xs.push(t.x);ys.push(t.y);});
    });
  }
  ys.push(p.lineOfScrimmage);
  if(CL.aim){xs.push(CL.aim.x);ys.push(CL.aim.y);}
  if(extra)extra.forEach(function(t){xs.push(t.x);ys.push(t.y);});
  var x0=Math.min.apply(null,xs)-30, x1=Math.max.apply(null,xs)+30;
  var y0=Math.min.apply(null,ys)-40, y1=Math.max.apply(null,ys)+60;
  var w=x1-x0, h=y1-y0;
  if(w<300){c=(x0+x1)/2; x0=c-150; w=300;}
  if(h<250){c=(y0+y1)/2; y0=c-125; h=250;}
  if(h/w>1.35){c=x0+w/2; w=h/1.35; x0=c-w/2;}
  if(w/h>2.2){c=y0+h/2; h=w/2.2; y0=c-h/2;}
  var MAX=2.4, z=(VB.w*VB.h)/(w*h);
  if(z>MAX){var k=Math.sqrt(z/MAX);
    c=x0+w/2; w*=k; x0=c-w/2; c=y0+h/2; h*=k; y0=c-h/2;}
  if(w<=VB.w)x0=Math.max(0,Math.min(x0,VB.w-w)); else x0=(VB.w-w)/2;
  if(h<=VB.h)y0=Math.max(0,Math.min(y0,VB.h-h)); else y0=(VB.h-h)/2;
  return{x:x0,y:y0,w:w,h:h};
}
function who(p){
  var d=ROSTER[p]||{};
  return (d.last||p||'')+(d.number?' '+d.number:'');    // last name and number, as the coach has it
}
function ours(p){return p.players.filter(function(q){return q.team==='us';});}

/* Same collision placer as the coach's app: ten names in a kickoff row will not
   fit under their own circles, so each one takes the first spot that clears the
   circles and the names already placed. */
function rectsOverlap(a,b){
  return !(a.x+a.w<=b.x||b.x+b.w<=a.x||a.y+a.h<=b.y||b.y+b.h<=a.y);
}
var CAND=[[0,16],[0,28],[0,40],[34,16],[-34,16],[34,28],[-34,28],[0,52],
          [0,-30],[0,-42],[48,-6],[-48,-6],[0,64],[62,16],[-62,16],[0,-54],
          [62,-6],[-62,-6],[46,40],[-46,40],[0,76],[0,-66],[78,16],[-78,16]];
function placeLabels(people){
  var FS=9.5, LH=12, out={};
  var obstacles=people.map(function(m){return{x:m.x-13,y:m.y-13,w:26,h:26};});
  var OA=play?look(play).aim:null;
  if(OA){
    obstacles.push({x:OA.x-14,y:OA.y-14,w:28,h:28});
    if(OA.label){
      var dd=OA.label.indexOf('\u2014');
      var aw=(dd>0?Math.max(dd,OA.label.length-dd-1):OA.label.length)*4.9+8;
      obstacles.push({x:OA.x-aw/2,y:OA.y+15,w:aw,h:dd>0?25:12});
    }
  }
  people.filter(function(m){return m.q.team==='us'&&m.q.player;})
    .slice().sort(function(a,b){return a.y-b.y||a.x-b.x;})
    .forEach(function(m){
      var d=ROSTER[m.q.player]||{}, full=who(m.q.player), short=(d.last||m.q.player);
      var texts=[full,short,(d.number||short.slice(0,3))];
      var best=null;
      for(var ti=0;ti<texts.length;ti++){
        if(best&&best.score<=0.5)break;
        var t=texts[ti], w=t.length*FS*0.58+5;
        for(var ci=0;ci<CAND.length;ci++){
          var rect={x:m.x+CAND[ci][0]-w/2,y:m.y+CAND[ci][1],w:w,h:LH}, sc=0;
          for(var oi=0;oi<obstacles.length;oi++) if(rectsOverlap(rect,obstacles[oi])) sc+=10;
          sc+=ci*0.45+ti*7;
          if(rect.x<VIEW.x+2)sc+=6;
          if(rect.x+rect.w>VIEW.x+VIEW.w-2)sc+=6;
          if(!best||sc<best.score)best={score:sc,text:t,dx:CAND[ci][0],dy:CAND[ci][1],w:w,rect:rect};
        }
      }
      out[m.q.id]=best;
      obstacles.push(best.rect);
    });
  return out;
}

/* ---- path helpers, used by the animation ---- */
function pathOf(p,q){
  var r=(look(p).routes||[]).filter(function(x){return x.playerId===q.id;})[0];
  var pts=PE.smoothPts([{x:q.x,y:q.y}].concat((r&&r.points)?r.points:[]));
  var segs=[],total=0;
  for(var i=1;i<pts.length;i++){
    var L=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);
    segs.push(L); total+=L;
  }
  return {pts:pts,segs:segs,total:total};
}
function atT(path,t){ return PE.walk(path.pts,t); }
/* ---- render ---- */
function drawField(opts){
  opts=opts||{};
  var p=play; if(!p)return;
  svg.innerHTML='';
  VIEW=opts.view||computeView(p);
  svg.setAttribute('viewBox',VIEW.x+' '+VIEW.y+' '+VIEW.w+' '+VIEW.h);
  svg.appendChild(E('rect',{x:VIEW.x,y:VIEW.y,width:VIEW.w,height:VIEW.h,fill:'#1D3A31'}));
  var g=E('g',{});
  for(var y=10;y<=VB.h-6;y+=28)
    g.appendChild(E('line',{x1:14,x2:406,y1:y,y2:y,stroke:'#EDEBE0','stroke-opacity':.09}));
  [140,280].forEach(function(hx){
    for(var y=10;y<=VB.h-6;y+=28)
      g.appendChild(E('line',{x1:hx-3,x2:hx+3,y1:y,y2:y,stroke:'#EDEBE0','stroke-opacity':.2}));
  });
  [14,406].forEach(function(sx){
    g.appendChild(E('line',{x1:sx,x2:sx,y1:0,y2:VB.h,stroke:'#EDEBE0','stroke-opacity':.3,'stroke-width':2}));
  });
  svg.appendChild(g);
  svg.appendChild(E('line',{x1:VIEW.x,x2:VIEW.x+VIEW.w,y1:p.lineOfScrimmage,y2:p.lineOfScrimmage,
    stroke:'#E3B547','stroke-width':1.8,'stroke-dasharray':'6 4'}));
  if(opts.routes){
    (look(p).routes||[]).forEach(function(r){
      var q=p.players.filter(function(z){return z.id===r.playerId;})[0];
      if(!q||!r.points.length)return;
      svg.appendChild(E('path',{d:PE.smoothD([{x:q.x,y:q.y}].concat(r.points)),fill:'none',
        stroke:'#E3B547','stroke-opacity':.28,'stroke-width':2,
        'stroke-linecap':'round','stroke-linejoin':'round'}));
    });
  }
  /* Where the ball is meant to end up. Same mark the coach places, drawn the same
     way, so the picture the boys learn from is the picture on his sheet. */
  if(opts.aim&&look(p).aim){
    var a=look(p).aim;
    if(a.from){
      var src=ours(p).filter(function(q){return q.label===a.from;})[0];
      if(src){
        var dx=a.x-src.x, dy=a.y-src.y, len=Math.hypot(dx,dy)||1;
        var ex2=a.x-dx/len*12, ey2=a.y-dy/len*12, bow=len*0.13;
        svg.appendChild(E('path',{d:'M'+src.x+','+src.y+' Q'+
          ((src.x+ex2)/2-dy/len*bow)+','+((src.y+ey2)/2+dx/len*bow)+' '+ex2+','+ey2,
          fill:'none',stroke:'#E58A6B','stroke-width':1.6,'stroke-opacity':.8,
          'stroke-dasharray':'2 5','stroke-linecap':'round'}));
      }
    }
    svg.appendChild(E('circle',{cx:a.x,cy:a.y,r:9.5,fill:'none',stroke:'#E58A6B','stroke-width':1.9}));
    [[-14,0,14,0],[0,-14,0,14]].forEach(function(d){
      svg.appendChild(E('line',{x1:a.x+d[0],y1:a.y+d[1],x2:a.x+d[2],y2:a.y+d[3],
        stroke:'#E58A6B','stroke-width':1.6,'stroke-linecap':'round'}));
    });
    svg.appendChild(E('circle',{cx:a.x,cy:a.y,r:2.4,fill:'#E58A6B'}));
    if(a.label){
      /* Same two-line caption as the coach's app: one long line runs off the side
         of a cropped view, and lands on the line-of-scrimmage caption. */
      var dash=a.label.indexOf('\u2014'), lines=[a.label];
      if(dash>0){
        var l1=a.label.slice(0,dash).trim(), l2=a.label.slice(dash+1).trim();
        if(l1&&l2)lines=[l1,l2];
      }
      var w2=lines.reduce(function(m,l){return Math.max(m,l.length*4.9+8);},0);
      var hh=lines.length*11+3;
      /* Same dodge as the coach's app: on an offensive play the eleven are packed
         round the ball and a caption placed under the mark lands on five of them. */
      var men=ours(p);
      function hits(rx,ry){
        if(ry<VIEW.y+2||ry+hh>VIEW.y+VIEW.h-2)return true;
        if(ry<p.lineOfScrimmage+9&&ry+hh>p.lineOfScrimmage-9)return true;
        return men.some(function(q){
          return !(rx+w2<=q.x-14||q.x+14<=rx||ry+hh<=q.y-14||q.y+14<=ry);
        });
      }
      var cx3=Math.max(VIEW.x+3,Math.min(a.x-w2/2,VIEW.x+VIEW.w-w2-3)), cy3=a.y+15, placed=false;
      [a.y+15,a.y-15-hh,a.y+30,a.y-32].forEach(function(ty){
        if(placed)return;
        [0,-46,46,-92,92].forEach(function(dx){
          if(placed)return;
          var rx=Math.max(VIEW.x+3,Math.min(a.x-w2/2+dx,VIEW.x+VIEW.w-w2-3));
          if(!hits(rx,ty)){cx3=rx;cy3=ty;placed=true;}
        });
      });
      if(!placed)cy3=Math.max(VIEW.y+2,Math.min(a.y+15,VIEW.y+VIEW.h-hh-2));
      svg.appendChild(E('rect',{x:cx3,y:cy3,width:w2,height:hh,rx:2,
        fill:'#13251F','fill-opacity':.82,stroke:'#E58A6B','stroke-width':.8,'stroke-opacity':.5}));
      lines.forEach(function(ln,i){
        var at=E('text',{x:cx3+w2/2,y:cy3+10+i*11,'text-anchor':'middle',fill:'#E58A6B',
          'font-family':'ui-monospace, SFMono-Regular, Menlo, monospace','font-size':8,'letter-spacing':.4});
        at.textContent=ln; svg.appendChild(at);
      });
    }
  }
  /* Their eleven, drawn under ours and moving with them, so a boy can see the
     man he has to beat doing what that man is coached to do. */
  if(opts.them&&showThem){
    var TH=themOf(p), tt=(opts.t===undefined?0:opts.t), MT=meets(p);
    /* Where the pairs are going to meet, marked from the first frame so a boy can
       see where his block or his tackle is supposed to happen before it does. It
       fills in once they get there. */
    MT.list.forEach(function(c){
      var here=tt>=c.t;
      svg.appendChild(E('circle',{cx:c.x,cy:c.y,r:here?11:9,fill:here?'rgba(229,138,107,.22)':'none',
        stroke:'#E58A6B','stroke-opacity':here?.95:.4,'stroke-width':here?2:1.2,
        'stroke-dasharray':here?'':'3 3'}));
      if(here)svg.appendChild(E('circle',{cx:c.x,cy:c.y,r:2.6,fill:'#E58A6B'}));
    });
    TH.men.forEach(function(m,bi){
      if(m.path.length>1){
        svg.appendChild(E('path',{d:PE.smoothD(m.raw||m.path),fill:'none',stroke:'#EDEBE0',
          'stroke-opacity':.16,'stroke-width':1.5,'stroke-linecap':'round',
          'stroke-linejoin':'round','stroke-dasharray':'5 4'}));
      }
      var mc=MT.them[bi];
      var at=(mc&&tt>=mc.t)?mc.b:PE.walk(m.path,tt);
      var on=opts.beat&&opts.beat===m;
      var xa=p.his?6:7;     /* his men sit closer together; see the note below */
      [[-xa,-xa,xa,xa],[-xa,xa,xa,-xa]].forEach(function(dd){
        svg.appendChild(E('line',{x1:at.x+dd[0],y1:at.y+dd[1],x2:at.x+dd[2],y2:at.y+dd[3],
          stroke:on?'#E58A6B':'#EDEBE0','stroke-opacity':on?1:.4,
          'stroke-width':on?3:2.2,'stroke-linecap':'round'}));
      });
    });
  }
  (opts.marks||[]).forEach(function(m){ svg.appendChild(m); });
  var people=opts.people||p.players.map(function(q){return{q:q,x:q.x,y:q.y};});
  var lay=opts.names?placeLabels(people):{};
  /* Fitting and placing depend on each other: a name pushed above the line only
     exists once the view is known, and then it has to fit inside it. Refit once
     around whatever was placed, then place again against the final edges. */
  if(opts.names&&!opts.view){
    var ex=[];
    Object.keys(lay).forEach(function(k){
      var r=lay[k].rect; ex.push({x:r.x,y:r.y},{x:r.x+r.w,y:r.y+r.h});
    });
    var v2=computeView(p,ex);
    if(v2.x!==VIEW.x||v2.y!==VIEW.y||v2.w!==VIEW.w||v2.h!==VIEW.h){
      VIEW=v2;
      svg.setAttribute('viewBox',VIEW.x+' '+VIEW.y+' '+VIEW.w+' '+VIEW.h);
      svg.firstChild.setAttribute('x',VIEW.x); svg.firstChild.setAttribute('y',VIEW.y);
      svg.firstChild.setAttribute('width',VIEW.w); svg.firstChild.setAttribute('height',VIEW.h);
      lay=placeLabels(people);
    }
  }
  /* A man is 24 units across and the coach's own offensive line is drawn with
     splits wider than they really are, or five of them would sit on top of each
     other. The head coach's diagrams are at true scale — his guards are 2.9
     yards apart, which is 21 units — so at our size his interior overlaps.
     Rather than move his men, which is the one thing this page must not do to
     his drawing, his are drawn a size down: 19 units across, still bigger
     relative to the field than the circles on his own sheet. */
  var R=p.his?9.5:12, FS=p.his?8:9;
  people.forEach(function(m){
    var q=m.q, hot=opts.hot===q.id, ghost=m.ghost;
    if(q.team==='them'){
      [[-7,-7,7,7],[-7,7,7,-7]].forEach(function(dd){
        svg.appendChild(E('line',{x1:m.x+dd[0],y1:m.y+dd[1],x2:m.x+dd[2],y2:m.y+dd[3],
          stroke:'#EDEBE0','stroke-opacity':.4,'stroke-width':2.2,'stroke-linecap':'round'}));
      });
      return;
    }
    svg.appendChild(E('circle',{cx:m.x,cy:m.y,r:R,
      fill:hot?'rgba(229,138,107,.3)':'rgba(19,37,31,.55)',
      stroke:hot?'#E58A6B':'#E3B547','stroke-width':hot?2.8:2,
      'stroke-opacity':ghost?.35:1,'stroke-dasharray':ghost?'3 3':''}));
    if(q.label&&!ghost){
      /* T-L is three characters in a smaller circle; drop it a point so it sits
         inside the ring rather than across it. */
      var fs=(p.his&&q.label.length>2)?FS-1:FS;
      var t=E('text',{x:m.x,y:m.y+(p.his?3.1:3.4),'text-anchor':'middle',fill:'#E3B547',
        'font-family':'ui-monospace, SFMono-Regular, Menlo, monospace','font-size':fs});
      t.textContent=q.label; svg.appendChild(t);
    }
    if(opts.names&&q.player&&!ghost&&lay[q.id]){
      var L=lay[q.id], lx=m.x+L.dx, ly=m.y+L.dy;
      svg.appendChild(E('rect',{x:lx-L.w/2,y:ly,width:L.w,height:12,rx:2,
        fill:'#13251F','fill-opacity':.82}));
      var n=E('text',{x:lx,y:ly+9,'text-anchor':'middle',fill:'#EDEBE0',
        'font-family':'ui-monospace, SFMono-Regular, Menlo, monospace','font-size':9.5});
      n.textContent=L.text; svg.appendChild(n);
      if(Math.abs(L.dx)>4||L.dy<0||L.dy>20)
        svg.appendChild(E('line',{x1:m.x,y1:m.y+(L.dy<0?-12:12),x2:lx,y2:(L.dy<0?ly+12:ly),
          stroke:'#EDEBE0','stroke-opacity':.42}));
    }
  });
}
</script>
<script>
/* ---------- loading ----------
   The coach's app writes pd-source to localStorage on every save. Same origin, so
   we can read it and show the boys exactly what he has on his device right now.
   A player on his own phone has no pd-source and gets the published playbook,
   which is correct — his edits reach them when he exports and it ships. */
var SRC='local', PUBLISHED=null;
function localSource(){
  try{
    var raw=localStorage.getItem('pd-source');
    if(!raw)return null;
    var d=JSON.parse(raw);
    return (d&&d.plays&&d.plays.length)?d:null;
  }catch(e){ return null; }
}
function paintSrc(){
  var el=document.getElementById('srcNote');
  if(SRC==='local'){
    el.innerHTML='Showing <b>coach\u2019s edits from this device</b>';
    var b=document.createElement('button'); b.textContent='Show published';
    b.onclick=function(){ SRC='published'; indexData(PUBLISHED); };
    el.appendChild(b);
  }else{
    el.innerHTML='Showing the <b>published playbook</b>';
    if(localSource()){
      var b2=document.createElement('button'); b2.textContent='Show coach\u2019s edits';
      b2.onclick=function(){ SRC='local'; indexData(localSource()); };
      el.appendChild(b2);
    }
  }
  /* His half is on the device, not in the playbook, so say so — otherwise a
     list that suddenly has 1,422 more calls in it has no explanation. */
  if(HIS.length){
    var s=document.createElement('span');
    s.innerHTML='· plus <b>'+HIS.length.toLocaleString()+'</b> offense &amp; defense from this device';
    el.appendChild(s);
  }
}
function indexData(d){
  DATA=d; BY_SLUG={}; ROSTER={};
  themKey=''; themCache=null; meetKey=''; meetCache=null;
  (d.roster||[]).forEach(function(r){ROSTER[r.last]=r;});
  (d.plays||[]).forEach(function(q){BY_SLUG[q.slug]=q;});
  var sel=document.getElementById('playSel');
  play=d.plays[0];
  paintPicker();
  sel.onchange=function(){ pickPlay(sel.value); };
  document.getElementById('loading').classList.add('hide');
  paintSrc();
  startMode();
}
/* If he has the coach's app open in another tab, a save lands here immediately. */
window.addEventListener('storage',function(e){

  .then(function(r){return r.json();})

/* ---------- the head coach's plays ------------------------------------------
   His 1,422 diagrams live on this device in IndexedDB (db `pp`, store `book`),
   written by the merged app at `/`. They are never in this repo — his artwork is
   password-protected and this site is public — so if a boy's phone has no book,
   NOTHING here runs and the page is the special teams only, exactly as it was.

   His plays are generated SVG, which is why they could never be played: a
   picture has no model under it. The parse below is the same one the merged app
   proved in `bridge/combined-shell.html` — copied rather than shared because
   that file is generated into index.html and this page cannot reach it. If it
   ever changes there, change it here too.

   His artwork itself is never shown on this page. It is read into men and
   routes, scaled into this page's own coordinates (his drawings are 16px to the
   yard, which his own captions confirm — a back drawn 7 yards deep sits 112px
   behind the line) and drawn on the same dark board as everything else. */
var NUM=/-?\d*\.?\d+/g;
function segsFromD(d){
  var cmds=d.match(/[MLQC][^MLQCZ]*/g);
  if(!cmds||cmds[0][0]!=='M')return null;
  var f=cmds[0].match(NUM); if(!f||f.length<2)return null;
  var pts=[{x:+f[0],y:+f[1]}];
  for(var i=1;i<cmds.length;i++){
    var n=(cmds[i].match(NUM)||[]).map(Number), k=cmds[i][0];
    if(k==='L'&&n.length>=2)pts.push({x:n[0],y:n[1]});
    else if(k==='Q'&&n.length>=4)pts.push({x:n[2],y:n[3]});
    else if(k==='C'&&n.length>=6)pts.push({x:n[4],y:n[5]});
    else return null;                 /* an unexpected command stays read-only */
  }
  return pts;
}
function readScene(svg){
  var men=[],lines=[],seen={},m;
  var G=/<g data-man="([^"]+)">([\s\S]*?)<\/g>/g;
  while((m=G.exec(svg))){
    var base=m[1],inner=m[2],at=null;
    var c=inner.match(/<circle cx="([-\d.]+)" cy="([-\d.]+)"/);
    var r=inner.match(/<rect x="([-\d.]+)" y="([-\d.]+)" width="([-\d.]+)" height="([-\d.]+)"/);
    if(c)at={x:+c[1],y:+c[2]};
    else if(r)at={x:+r[1]+ +r[3]/2, y:+r[2]+ +r[4]/2};
    if(!at)continue;
    var n=seen[base]||0; seen[base]=n+1;
    men.push({id:base+'#'+n, label:base.replace(/^D:/,''), x:at.x, y:at.y,
              side:base.indexOf('D:')===0?'defense':'offense'});
  }
  var E2=/<(path|line)\s([^>]*)\/>/g;
  while((m=E2.exec(svg))){
    var a=m[2], owner=(a.match(/data-owner="([^"]+)"/)||[])[1];
    if(!owner)continue;
    var term=(a.match(/data-term="([^"]+)"/)||[])[1]
             ||(a.indexOf('marker-end')>=0?'arrow':'none');
    var pts=null;
    if(m[1]==='line'){
      var g=function(k){return +(a.match(new RegExp(k+'="([-\\d.]+)"'))||[])[1];};
      var x1=g('x1'),y1=g('y1'),x2=g('x2'),y2=g('y2');
      if([x1,y1,x2,y2].some(isNaN))continue;
      pts=[{x:x1,y:y1},{x:x2,y:y2}];
    }else{
      var d=(a.match(/(?:^|\s)d="([^"]+)"/)||[])[1];
      pts=d?segsFromD(d):null;
    }
    if(!pts)continue;
    lines.push({owner:owner, role:(a.match(/data-role="([^"]+)"/)||[])[1]||'', term:term, pts:pts});
  }
  return {men:men,lines:lines};
}
/* A block tee ends ON the man being blocked, so that pairing is read straight
   off his drawing rather than guessed at. Everyone else pairs by distance. */
var BLOCK_REACH=26;
function sceneToPlay(sc){
  var defs=sc.men.filter(function(m){return m.side==='defense';});
  var covers={};
  sc.lines.forEach(function(l){
    if(l.term!=='tee'||!l.owner||!defs.length)return;
    var end=l.pts[l.pts.length-1], best=null;
    defs.forEach(function(d){
      var dist=Math.hypot(end.x-d.x,end.y-d.y);
      if(!best||dist<best.d)best={id:d.id,d:dist};
    });
    if(best&&best.d<=BLOCK_REACH)covers[l.owner]=best.id;
  });
  var byOwner={};
  sc.lines.forEach(function(l){
    if(!l.owner||l.term==='none')return;
    if(!byOwner[l.owner]||l.term==='arrow')byOwner[l.owner]=l;
  });
  function build(m){
    var base=m.id.split('#')[0];
    var line=byOwner[m.id]||byOwner[base];
    var raw=line?[{x:m.x,y:m.y}].concat(line.pts.slice(1)):[{x:m.x,y:m.y}];
    return {id:m.id,label:m.label,side:m.side,x:m.x,y:m.y,
            covers:covers[m.id]||covers[base]||'', raw:raw};
  }
  return {offense:sc.men.filter(function(m){return m.side==='offense';}).map(build),
          defense:defs.map(build)};
}

/* His book, as it sits on the device. Held raw: converting 1,422 diagrams up
   front is work nobody asked for, so a play is turned into a model the first
   time it is picked and kept after that. */
var HIS=[], HIS_BY_ID={}, HIS_CACHE={};
var HIS_K=16/(392/53.3), HIS_LOS=250;   /* his 16px per yard -> ours 7.35 */
function hisPlayFor(e){
  if(HIS_CACHE[e.id])return HIS_CACHE[e.id];
  var sp=sceneToPlay(readScene(e.svg||''));
  if(!sp.offense.length)return null;
  var lm=(e.svg||'').match(/<line x1="28" y1="([-\d.]+)"/), los=lm?+lm[1]:300;
  function X(x){return Math.round((210+(x-460)/HIS_K)*100)/100;}
  function Y(y){return Math.round((HIS_LOS+(y-los)/HIS_K)*100)/100;}
  function T(pts){return pts.map(function(t){return {x:X(t.x),y:Y(t.y)};});}
  var players=[], routes=[];
  sp.offense.forEach(function(o){
    players.push({id:o.id,label:o.label,x:X(o.x),y:Y(o.y),team:'us',
                  role:'',job:'',player:'',covers:o.covers||''});
    if(o.raw.length>1)routes.push({playerId:o.id,points:T(o.raw.slice(1))});
  });
  /* Their eleven in the same shape mirror() hands back for our plays: a `raw`
     for drawing, a sampled `path` for walking, and the id under `key` so a
     block tee can name which of two men called T is the one being blocked. */
  var men=sp.defense.map(function(d){
    var raw=T(d.raw);
    return {key:d.id,label:d.label,role:'',job:'',x:raw[0].x,y:raw[0].y,
            raw:raw,path:PE.smoothPts(raw),q:{label:d.label}};
  });
  var p={slug:'his:'+e.id, name:e.call||e.id, his:true, section:e.section||'rest',
         lineOfScrimmage:HIS_LOS, players:players, routes:routes, aim:null,
         howItWorks:e.caption||'',
         _them:{men:men,routes:men.filter(function(m){return m.path.length>1;}),name:'The defense'}};
  HIS_CACHE[e.id]=p;
  return p;
}

/* IndexedDB, read only. The merged app owns this store; this page never writes
   to it. Anything that goes wrong reading it leaves HIS empty, which is the
   same as a phone that never had the book. */
var BOOK_DB='pp', BOOK_STORE='book', BOOK_KEY='book';
function oldLocalBook(){
  try{
    var raw=localStorage.getItem('pp-book'); if(!raw)return null;
    var b=JSON.parse(raw);
    return (b&&b.plays&&b.plays.length)?b:null;
  }catch(e){ return null; }
}
function openBook(){
  return new Promise(function(res){
    var r;
    try{ r=indexedDB.open(BOOK_DB,1); }catch(e){ return res(oldLocalBook()); }
    r.onupgradeneeded=function(){
      try{ r.result.createObjectStore(BOOK_STORE); }catch(e){}
    };
    r.onerror=function(){ res(oldLocalBook()); };
    r.onsuccess=function(){
      try{
        var st=r.result.transaction(BOOK_STORE,'readonly').objectStore(BOOK_STORE);
        var q=st.get(BOOK_KEY);
        q.onsuccess=function(){
          var b=q.result;
          res((b&&b.plays&&b.plays.length)?b:oldLocalBook());
        };
        q.onerror=function(){ res(oldLocalBook()); };
      }catch(e){ res(oldLocalBook()); }
    };
  });
}
/* A player's phone has no book and never will, so it should not end up with an
   empty database it did not ask for: where the browser can list them, a `pp`
   that is not there is answered without opening anything. */
function readBook(){
  if(!window.indexedDB)return Promise.resolve(oldLocalBook());
  if(!indexedDB.databases)return openBook();
  return indexedDB.databases().then(function(list){
    var has=(list||[]).some(function(d){return d&&d.name===BOOK_DB;});
    return has?openBook():oldLocalBook();
  }).catch(function(){ return openBook(); });
}
readBook().then(function(b){
  if(!b||!Array.isArray(b.plays))return;
  /* One entry per id: two copies of a diagram would be two identical rows in
     the picker, and the second could never be reached. */
  HIS=b.plays.filter(function(p){
    if(!p||!p.svg||p.side==='ours'||HIS_BY_ID[p.id])return false;
    HIS_BY_ID[p.id]=p; return true;
  });
  if(!HIS.length)return;
  if(DATA){ paintPicker(); paintSrc(); }   /* the playbook may still be in flight */
}).catch(function(){ /* no book, no change */ });

/* ---------- the picker ----------
   With no book this is the plain list of the special teams it has always been.
   With one, it groups, so which half a call belongs to is never a guess. */
var HIS_GROUPS=[['core','Offense & defense \u2014 the core'],
                ['rest','Offense & defense \u2014 everything else']];
function paintPicker(){
  var sel=document.getElementById('playSel');
  var want=sel.value||(play?play.slug:'');
  sel.innerHTML='';
  var mine=(DATA&&DATA.plays?DATA.plays:[]).slice()
    .sort(function(a,b){return (a.order||99)-(b.order||99);});
  function opt(parent,value,text){
    var o=document.createElement('option'); o.value=value; o.textContent=text;
    parent.appendChild(o);
  }
  if(!HIS.length){
    mine.forEach(function(q){ opt(sel,q.slug,q.name); });
  }else{
    var g=document.createElement('optgroup'); g.label='Special teams';
    mine.forEach(function(q){ opt(g,q.slug,q.name); });
    sel.appendChild(g);
    HIS_GROUPS.forEach(function(sec){
      var rows=HIS.filter(function(p){return (p.section||'rest')===sec[0];});
      if(!rows.length)return;
      var gg=document.createElement('optgroup'); gg.label=sec[1];
      rows.forEach(function(p){ opt(gg,'his:'+p.id,p.call||p.id); });
      sel.appendChild(gg);
    });
  }
  if(want)sel.value=want;
  if(!sel.value&&sel.options.length)sel.selectedIndex=0;
}
/* His plays are read the moment one is picked, and a diagram that cannot be
   read says so and leaves the boy on the play he was already watching, rather
   than blanking the field. */
function pickPlay(v){
  var next=null;
  if(v&&v.indexOf('his:')===0){
    var e=HIS_BY_ID[v.slice(4)];
    try{ next=e?hisPlayFor(e):null; }catch(err){ next=null; }
    if(!next){
      var n=document.getElementById('noJobs');
      n.classList.remove('hide');
      n.textContent='That diagram could not be read \u2014 still showing '+(play?play.name:'the last play')+'.';
      document.getElementById('playSel').value=play?play.slug:'';
      return;
    }
  }else next=BY_SLUG[v];
  if(!next)return;
  play=next; lookIx=0; startMode();
}

/* ---------- mode switching ---------- */
document.querySelectorAll('.tab').forEach(function(b){
  b.onclick=function(){
    mode=b.dataset.m;
    document.querySelectorAll('.tab').forEach(function(o){
      o.setAttribute('aria-pressed',o.dataset.m===mode);});

  };
});
function show(id){
  ['watchUI','lineupUI','quizUI'].forEach(function(x){
    document.getElementById(x).classList.toggle('hide',x!==id);});
}
/* One chip per kick, so a boy can watch the same eleven cover a deep ball, a
   pooch and a squib. Hidden on a unit that only happens one way. */
function paintLooks(){
  var bar=document.getElementById('lookBar');
  var lks=looksOf(play);
  if(lks.length<2){bar.hidden=true;bar.innerHTML='';return;}
  bar.hidden=false;
  bar.innerHTML='<span class="lkHint">The kick:</span>';
  lks.forEach(function(lk,i){
    var b=document.createElement('button');
    b.type='button'; b.textContent=lk.name||('Look '+(i+1));
    b.setAttribute('aria-pressed',i===lookIx);
    b.onclick=function(){ lookIx=i; startMode(); };
    bar.appendChild(b);
  });
}
document.getElementById('themBtn').onclick=function(){
  showThem=!showThem;
  this.textContent='Them: '+(showThem?'on':'off');
  this.setAttribute('aria-pressed',showThem);
  watchView=null; startWatch();
};
function startMode(){
  stopAnim();
  /* My job is built out of the written jobs, and the head coach's diagrams do
     not carry one per man. Rather than ask a question it cannot score, the tab
     switches itself off on his plays and says why. */
  var noJobs=!!(play&&play.his);
  var qt=document.querySelector('.tab[data-m="quiz"]');
  qt.disabled=noJobs;
  var note=document.getElementById('noJobs');
  note.classList.toggle('hide',!noJobs);
  if(noJobs)note.innerHTML='My job is off on the offense and defense '+
    '&mdash; those plays do not carry a written job for each man yet.';
  if(noJobs&&mode==='quiz')mode='watch';
  document.querySelectorAll('.tab').forEach(function(o){
    o.setAttribute('aria-pressed',o.dataset.m===mode);});
  if(lookIx>=looksOf(play).length)lookIx=0;
  paintLooks();
  if(mode==='watch'){show('watchUI'); startWatch();}
  else if(mode==='lineup'){show('lineupUI'); startLineup();}
  else {show('quizUI'); startQuiz();}
}

/* ---------- watch it ---------- */
var anim=null, tNow=0, speed=1, paths=[];
function stopAnim(){ if(anim){cancelAnimationFrame(anim);anim=null;} }
function buildPaths(){
  paths=ours(play).map(function(q){return {q:q,path:pathOf(play,q)};});
}
function frameAt(t){
  var MT=showThem?meets(play):{us:{}};
  drawField({routes:true,names:true,aim:true,them:true,t:t,view:watchView,
    people:paths.map(function(e){
      // a man who has met his man stops there — that is the block, or the tackle
      var c=MT.us[e.q.id];
      var pt=(c&&t>=c.t)?c.a:atT(e.path,t);
      return {q:e.q,x:pt.x,y:pt.y};
    })});
}
var watchView=null;
function startWatch(){
  buildPaths();
  watchView=null;          // first frame fits itself, including the names
  tNow=0; speed=1;
  document.getElementById('scrub').value=0;
  document.getElementById('playBtn').textContent='\u25b6 Play';
  document.getElementById('slowBtn').textContent='Slow';
  var moving=ours(play).filter(function(q){return pathOf(play,q).total>0;}).length;
  document.getElementById('watchNote').innerHTML=
    (play.howItWorks?'<b>'+esc(play.name)+'</b> \u2014 '+esc(play.howItWorks)+'<br><br>':'<b>'+esc(play.name)+'</b> \u2014 ')+
    moving+' of '+ours(play).length+
    ' men have a path. Drag the slider to walk through it a step at a time.'+
    (look(play).how?'<br><br>'+esc(look(play).how):'')+
    (look(play).aim&&look(play).aim.label?'<br><br>The crosshair is where the ball is meant to end up: <b>'+
      esc(look(play).aim.label)+'</b>':'');
  frameAt(0);
  watchView=VIEW;          // then lock it so the view does not jitter as they run
}
function runAnim(){
  var last=null;
  function step(ts){
    if(last===null)last=ts;
    var dt=(ts-last)/1000; last=ts;
    tNow+=dt/(3.2/speed);
    if(tNow>=1){ tNow=1; frameAt(1); document.getElementById('scrub').value=1000;
      document.getElementById('playBtn').textContent='\u25b6 Play'; anim=null; return; }
    document.getElementById('scrub').value=Math.round(tNow*1000);
    frameAt(tNow);
    anim=requestAnimationFrame(step);
  }
  anim=requestAnimationFrame(step);
}
document.getElementById('playBtn').onclick=function(){
  if(anim){ stopAnim(); this.textContent='\u25b6 Play'; return; }
  if(tNow>=1)tNow=0;
  this.textContent='\u2016 Pause'; runAnim();
};
document.getElementById('slowBtn').onclick=function(){
  speed=speed===1?0.4:1; this.textContent=speed===1?'Slow':'Normal';
};
document.getElementById('againBtn').onclick=function(){
  stopAnim(); tNow=0; document.getElementById('scrub').value=0;
  document.getElementById('playBtn').textContent='\u25b6 Play'; frameAt(0);
};
document.getElementById('scrub').oninput=function(){
  stopAnim(); document.getElementById('playBtn').textContent='\u25b6 Play';
  tNow=this.value/1000; frameAt(tNow);
};

/* ---------- line me up ---------- */
var lineQueue=[], lineDone=[], lineCur=null, lineScore=0, lineTried=0, lineView=null;
function startLineup(){
  lineQueue=ours(play).filter(function(q){return q.label;})
    .slice().sort(function(){return Math.random()-0.5;});
  lineDone=[]; lineScore=0; lineTried=0;
  lineView=computeView(play);
  nextLine();
}
function nextLine(){
  document.getElementById('lineVerdict').textContent='';
  if(!lineQueue.length){
    lineCur=null;
    document.getElementById('lineAsk').innerHTML=
      '<b>Done.</b> '+lineScore+' of '+lineTried+' in the right spot.';
    paintLineup(true);
    return;
  }
  lineCur=lineQueue.shift();
  document.getElementById('lineAsk').innerHTML=
    'Tap where <b>'+esc(lineCur.label)+'</b>'+
    (lineCur.role?' \u2014 the '+esc(lineCur.role)+' man':'')+' lines up.';
  paintLineup(false);
}
function paintLineup(showAll){
  var people=lineDone.map(function(e){return {q:e.q,x:e.q.x,y:e.q.y};});
  if(showAll)people=play.players.map(function(q){return {q:q,x:q.x,y:q.y};});
  drawField({view:lineView,names:showAll,people:people,marks:lineMarks});
}
var lineMarks=[];
function svgPoint(evt){
  var r=svg.getBoundingClientRect();
  var cx=(evt.touches?evt.touches[0].clientX:evt.clientX);
  var cy=(evt.touches?evt.touches[0].clientY:evt.clientY);
  return {x:VIEW.x+(cx-r.left)/r.width*VIEW.w, y:VIEW.y+(cy-r.top)/r.height*VIEW.h};
}
svg.addEventListener('click',function(e){
  if(mode!=='lineup'||!lineCur)return;
  var c=svgPoint(e);
  var d=Math.hypot(c.x-lineCur.x, c.y-lineCur.y);
  var yards=d/(392/53.3);
  lineTried++;
  var v=document.getElementById('lineVerdict');
  if(yards<=3){ lineScore++; v.className='verdict good'; v.textContent='That is the spot.'; }
  else if(yards<=7){ lineScore++; v.className='verdict near';
    v.textContent='Close enough \u2014 about '+yards.toFixed(0)+' yards off.'; }
  else { v.className='verdict off';
    v.textContent='Not quite \u2014 about '+yards.toFixed(0)+' yards off. He goes on the circle.'; }
  lineMarks=[E('line',{x1:c.x-6,y1:c.y-6,x2:c.x+6,y2:c.y+6,stroke:'#E58A6B','stroke-width':2}),
             E('line',{x1:c.x-6,y1:c.y+6,x2:c.x+6,y2:c.y-6,stroke:'#E58A6B','stroke-width':2})];
  lineDone.push({q:lineCur});
  var keep=lineCur; lineCur=null;
  drawField({view:lineView,names:false,hot:keep.id,marks:lineMarks,
    people:lineDone.map(function(x){return {q:x.q,x:x.q.x,y:x.q.y};})});
  lineMarks=[];
  document.getElementById('lineScore').innerHTML='<b>'+lineScore+'</b> of '+lineTried+' right';
});
document.getElementById('lineNext').onclick=nextLine;
document.getElementById('lineRestart').onclick=startLineup;

/* ---------- my job ---------- */
var quizQueue=[], quizCur=null, quizScore=0, quizTried=0, quizLocked=false;
function allJobs(){
  var out=[];
  (DATA.plays||[]).forEach(function(p){
    p.players.filter(function(q){return q.team==='us'&&q.job;}).forEach(function(q){
      if(!out.some(function(x){return x.job===q.job;}))out.push({job:q.job,role:q.role});
    });
  });
  return out;
}
function startQuiz(){
  quizQueue=ours(play).filter(function(q){return q.job;})
    .slice().sort(function(){return Math.random()-0.5;});
  quizScore=0; quizTried=0;
  nextQuiz();
}
function nextQuiz(){
  quizLocked=false;
  document.getElementById('quizVerdict').textContent='';
  var box=document.getElementById('quizOpts'); box.innerHTML='';
  if(!quizQueue.length){
    quizCur=null;
    document.getElementById('quizAsk').innerHTML= quizTried
      ? '<b>Done.</b> '+quizScore+' of '+quizTried+' right.'
      : 'Nobody on this unit has a job written yet. Try another play.';
    drawField({names:true,aim:true,them:true,t:1});
    return;
  }
  document.getElementById('quizBeat').classList.add('hide');
  quizCur=quizQueue.shift();
  document.getElementById('quizAsk').innerHTML=
    'You are <b>'+esc(quizCur.label)+'</b>'+(quizCur.role?' \u2014 the '+esc(quizCur.role)+' man':'')+
    ' on '+esc(play.name)+'. What is your job?';
  drawField({hot:quizCur.id,names:false,them:true,t:0});
  var pool=allJobs().filter(function(x){return x.job!==quizCur.job;})
    .sort(function(){return Math.random()-0.5;}).slice(0,3);
  var opts=pool.concat([{job:quizCur.job,role:quizCur.role}])
    .sort(function(){return Math.random()-0.5;});
  opts.forEach(function(o){
    var b=document.createElement('button');
    b.className='opt'; b.textContent=o.job;
    b.onclick=function(){
      if(quizLocked)return; quizLocked=true; quizTried++;
      var right=(o.job===quizCur.job);
      if(right)quizScore++;
      b.className='opt '+(right?'right':'wrong');
      if(!right)[].forEach.call(box.children,function(c){
        if(c.textContent===quizCur.job)c.className='opt right';});
      var v=document.getElementById('quizVerdict');
      v.className='verdict '+(right?'good':'off');
      v.textContent=right?'That is it.':'Not that one \u2014 the green one is yours.';
      /* Once he knows his job, show him the man he has to beat and what that man
         is coached to do — both read off the coach's own opposing play. */
      var m=matchups(play)[quizCur.id];
      var bx=document.getElementById('quizBeat');
      if(m){
        bx.innerHTML='<p><b>Across from you:</b> '+esc(m.label||'their man')+
          (m.role?' \u2014 the '+esc(m.role)+' man':'')+'</p>'+
          (m.job?'<p><b>He will try to:</b> '+esc(m.job)+'</p>':'')+
          '<p><b>You beat him by:</b> '+esc(quizCur.job)+'</p>';
        bx.classList.remove('hide');
        drawField({hot:quizCur.id,names:false,them:true,t:1,beat:m});
      }else bx.classList.add('hide');
      document.getElementById('quizScore').innerHTML='<b>'+quizScore+'</b> of '+quizTried+' right';
    };
    box.appendChild(b);
  });
}
document.getElementById('quizNext').onclick=nextQuiz;
document.getElementById('quizRestart').onclick=startQuiz;
</script>
</body>
</html>
