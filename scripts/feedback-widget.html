<!-- ==========================================================================
     THE LIGHTBULB. An idea or a problem, filed without leaving the app.

     Shared source. scripts/sync-feedback.js inlines this between the markers in
     designer.html and index.html -- same pattern, and same reason, as the play
     data and the engine: a <script src> cannot be read from a downloaded local
     file or inside the artifact viewer, so the block has to be literally
     present in each page. `--check` fails on drift.

     WHY IT KEEPS A LOCAL QUEUE. He types these on a practice field. The one
     thing a feedback button must never do is take a note and lose it, so a send
     that does not come back 200 leaves the note on the device and says so, and
     the next page load tries again. That is the same rule as the save badge:
     never claim success on anything but a resolved write.

     WHY IT SAYS THE REPO IS PUBLIC. It files a GitHub issue on a public repo.
     api/feedback.js strips emails, phone numbers and anything shaped like a
     name-beside-a-jersey-number before posting, but the honest thing is to say
     so on the box as well, because a coach describing a bug will reach for a
     player's name without thinking about it.
     ========================================================================== -->
<style id="fb-style">
  #fbFab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));
    width:52px;height:52px;border-radius:50%;border:1px solid rgba(237,235,224,.25);
    background:var(--board,#1D3A31);color:var(--gold,#E3B547);font-size:24px;line-height:1;
    cursor:pointer;z-index:1400;box-shadow:0 6px 20px rgba(0,0,0,.45);
    display:flex;align-items:center;justify-content:center;padding:0}
  #fbFab:hover{background:var(--deep,#0D1B16)}
  #fbFab .fbDot{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;
    border-radius:9px;background:var(--warm,#E58A6B);color:#0D1B16;font-size:11px;
    font-weight:700;display:none;align-items:center;justify-content:center;padding:0 5px}
  #fbPanel{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));
    width:min(340px,calc(100vw - 32px));background:var(--board,#1D3A31);
    color:var(--chalk,#EDEBE0);border:1px solid rgba(237,235,224,.25);border-radius:12px;
    padding:12px;z-index:1450;box-shadow:0 14px 40px rgba(0,0,0,.55);display:none;
    font-family:var(--body,system-ui,sans-serif);font-size:14px}
  #fbPanel h3{margin:0 0 8px;font-size:15px}
  #fbPanel .fbKinds{display:flex;gap:6px;margin:0 0 8px}
  #fbPanel .fbKinds button{flex:1;padding:7px 8px;border-radius:8px;cursor:pointer;
    font-family:inherit;font-size:13px;background:var(--deep,#0D1B16);
    color:var(--chalk,#EDEBE0);border:1px solid rgba(237,235,224,.25)}
  #fbPanel .fbKinds button[aria-pressed="true"]{background:var(--gold,#E3B547);
    color:var(--deep,#0D1B16);border-color:var(--gold,#E3B547);font-weight:700}
  #fbPanel textarea{width:100%;box-sizing:border-box;min-height:92px;resize:vertical;
    background:var(--deep,#0D1B16);color:var(--chalk,#EDEBE0);
    border:1px solid rgba(237,235,224,.25);border-radius:8px;padding:8px;
    font-family:inherit;font-size:14px}
  #fbPanel .fbNote{font-size:11.5px;color:var(--soft,#9AA69C);margin:6px 0 8px;line-height:1.4}
  #fbPanel .fbRow{display:flex;gap:6px;align-items:center}
  #fbPanel .fbRow button{padding:8px 12px;border-radius:8px;cursor:pointer;
    font-family:inherit;font-size:13px;border:1px solid rgba(237,235,224,.25);
    background:var(--deep,#0D1B16);color:var(--chalk,#EDEBE0)}
  #fbPanel .fbRow button.fbSend{background:var(--gold,#E3B547);color:var(--deep,#0D1B16);
    border-color:var(--gold,#E3B547);font-weight:700}
  #fbPanel .fbStatus{font-size:12px;margin-top:8px;min-height:1.2em}
  #fbPanel .fbStatus.ok{color:var(--gold,#E3B547)}
  #fbPanel .fbStatus.warn{color:var(--warm,#E58A6B)}
  /* Print and game day, both explicit. CLAUDE.md: an element left out of the
     print hide list prints, which is exactly how the game-day bar leaked. */
  @media print{#fbFab,#fbPanel{display:none!important}}
  body.gd #fbFab,body.gd #fbPanel{display:none!important}
</style>

<button id="fbFab" type="button" aria-label="Send an idea or report a problem"
        title="Send an idea or report a problem">💡<span class="fbDot" id="fbDot"></span></button>

<div id="fbPanel" role="dialog" aria-modal="false" aria-labelledby="fbTitle">
  <h3 id="fbTitle">Tell me something</h3>
  <div class="fbKinds">
    <button type="button" id="fbKindIdea" aria-pressed="true">Idea</button>
    <button type="button" id="fbKindProblem" aria-pressed="false">Problem</button>
  </div>
  <textarea id="fbText" placeholder="What would you change, or what went wrong?"
            aria-label="Your message"></textarea>
  <p class="fbNote">Goes to the project's issue list, which is <b>public</b>. Player
     names and email addresses are stripped before it posts &mdash; but say
     &ldquo;the left gunner&rdquo; rather than a boy's name.</p>
  <div class="fbRow">
    <button type="button" class="fbSend" id="fbSend">Send</button>
    <button type="button" id="fbClose">Close</button>
  </div>
  <p class="fbStatus" id="fbStatus"></p>
</div>

<script id="fb-script">
(function () {
  var QKEY = 'pd-feedback-queue';
  var fab = document.getElementById('fbFab');
  var panel = document.getElementById('fbPanel');
  var box = document.getElementById('fbText');
  var status = document.getElementById('fbStatus');
  var dot = document.getElementById('fbDot');
  var kind = 'idea';
  if (!fab || !panel) return;

  function queue() {
    try { var q = JSON.parse(localStorage.getItem(QKEY) || '[]'); return q.length ? q : []; }
    catch (e) { return []; }
  }
  function setQueue(q) {
    try { localStorage.setItem(QKEY, JSON.stringify(q.slice(-20))); } catch (e) {}
    paintDot();
  }
  function paintDot() {
    var n = queue().length;
    dot.textContent = n;
    dot.style.display = n ? 'flex' : 'none';
    fab.title = n ? n + ' waiting to send' : 'Send an idea or report a problem';
  }

  /* What the page knows about ITSELF. Deliberately no roster: the build, the
     path, which play is open by slug, and the viewport. A slug is a formation
     name, not a child. */
  function context() {
    var bits = [];
    try { bits.push('page ' + location.pathname); } catch (e) {}
    try {
      // The short chip, never the long note: designer.html's #buildNote is a
      // whole sentence about caching, and it made the context unreadable.
      var chip = document.getElementById('buildChip') || document.getElementById('buildchip');
      if (chip && chip.textContent.trim()) bits.push('build ' + chip.textContent.trim());
    } catch (e) {}
    try {
      // The SLUG, not the internal id. `plf6548c72ba2a` tells nobody anything;
      // `punt-base` is the thing he and I would both say out loud.
      var sel = document.getElementById('playSel');
      if (sel && sel.selectedIndex >= 0) {
        var o = sel.options[sel.selectedIndex];
        var label = (o && o.textContent || '').trim();
        if (label) bits.push('play ' + label);
      }
    } catch (e) {}
    try { bits.push('screen ' + window.innerWidth + 'x' + window.innerHeight); } catch (e) {}
    try { bits.push('when ' + new Date().toISOString()); } catch (e) {}
    return bits.join('\n');
  }

  function say(msg, cls) {
    status.textContent = msg || '';
    status.className = 'fbStatus' + (cls ? ' ' + cls : '');
  }

  /* One note. Resolves to true only on a real 200 -- everything else keeps it
     on the device, because a feedback button that loses notes is worse than no
     feedback button. */
  function send(item) {
    return fetch('/api/feedback', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(item)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        return { ok: r.ok && j && j.ok === true, status: r.status, j: j || {} };
      });
    }).catch(function (e) { return { ok: false, status: 0, j: { error: String(e.message || e) } }; });
  }

  function flush() {
    var q = queue();
    if (!q.length) return Promise.resolve(0);
    var sent = 0;
    return q.reduce(function (p, item) {
      return p.then(function () {
        return send(item).then(function (r) { if (r.ok) { sent++; item.__sent = true; } });
      });
    }, Promise.resolve()).then(function () {
      setQueue(q.filter(function (i) { return !i.__sent; }));
      return sent;
    });
  }

  fab.addEventListener('click', function () {
    var open = panel.style.display === 'block';
    panel.style.display = open ? 'none' : 'block';
    if (!open) { box.focus(); say(queue().length ? queue().length + ' still waiting to send.' : ''); }
  });
  document.getElementById('fbClose').addEventListener('click', function () {
    panel.style.display = 'none';
  });
  function pickKind(k) {
    kind = k;
    document.getElementById('fbKindIdea').setAttribute('aria-pressed', String(k === 'idea'));
    document.getElementById('fbKindProblem').setAttribute('aria-pressed', String(k === 'problem'));
  }
  document.getElementById('fbKindIdea').addEventListener('click', function () { pickKind('idea'); });
  document.getElementById('fbKindProblem').addEventListener('click', function () { pickKind('problem'); });

  document.getElementById('fbSend').addEventListener('click', function () {
    var text = (box.value || '').trim();
    if (text.length < 3) { say('Say a bit more than that.', 'warn'); return; }
    var item = { kind: kind, message: text, context: context() };
    say('Sending…');
    send(item).then(function (r) {
      if (r.ok) {
        box.value = '';
        say('Sent. Thank you — #' + (r.j.number || '?'), 'ok');
        return flush();
      }
      // NOT sent. Keep it, and say exactly that.
      var q = queue(); q.push(item); setQueue(q);
      say(r.status === 501
        ? 'Saved on this device. Sending is not switched on for this site yet.'
        : 'Saved on this device — could not send just now. It will try again next time you open this.',
        'warn');
    });
  });

  paintDot();
  // Best effort, and silent: a retry that shouts on every page load is a retry
  // he learns to ignore.
  if (queue().length) { setTimeout(function () { flush().then(paintDot); }, 1500); }
})();
</script>
